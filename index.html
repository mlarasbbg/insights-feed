<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insights Feed</title>

  <style>
    @font-face {
  font-family: 'ABCFavorit';
  src: url('./fonts/ABCFavorit-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
  }

  @font-face {
    font-family: 'ABCFavorit';
    src: url('./fonts/ABCFavorit-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
    }

    :root {
      --text: #3B3B3D;
      --muted: #5c5c5e;
      --border: #e5e5e5;
      --link: #254e2b;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px 18px;
      background: var(--bg);
      color: var(--text);
      font-family: 'ABCFavorit', Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .feed {
      display: flex;
      flex-direction: column;
    }

    .item {
      display: flex;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      transition: opacity 0.15s ease;
    }

    .item:hover {
      opacity: 0.92;
    }

    .item:last-child {
      border-bottom: none;
    }

    .thumb {
      width: 92px;
      height: 92px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
      background: #f5f5f5;
    }

    .content {
      flex: 1;
      min-width: 0;
    }

   .title {
  display: inline-block;
  font-size: 17px;
  line-height: 1.35;
  font-weight: 700;
  color: #3B3B3D;
  text-decoration: none;
  margin-bottom: 6px;
  font-family: 'ABCFavorit', Arial, sans-serif;
  transition: opacity 0.15s ease;
  }
  
  .title:hover {
    color: #3B3B3D;
    text-decoration: underline;
  }

    .excerpt {
      font-size: 15px;
      color: var(--text);
      line-height: 1.5;
      font-family: 'ABCFavorit', Arial, sans-serif;

      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .status,
    .error {
      font-size: 14px;
      color: var(--muted);
      padding: 10px 0;
      font-family: 'ABCFavorit', Arial, sans-serif;
    }

    .error {
      color: #a1260d;
    }

    @media (max-width: 640px) {
      .thumb {
        width: 78px;
        height: 78px;
      }

      .title {
        font-size: 16px;
      }

      .excerpt {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div id="feed" class="feed">
    <div class="status">Loading insights...</div>
  </div>

  <script>
    const apiUrl =
      "https://sbbotanicgarden.org/wp-json/wp/v2/insight?per_page=5&_embed";

    const feedEl = document.getElementById("feed");

    function stripHtml(html) {
      const div = document.createElement("div");
      div.innerHTML = html || "";
      return div.textContent || div.innerText || "";
    }

    async function loadFeed() {
      try {
        const response = await fetch(apiUrl, { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const posts = await response.json();

        if (!Array.isArray(posts) || posts.length === 0) {
          feedEl.innerHTML = '<div class="status">No insights found.</div>';
          return;
        }

        feedEl.innerHTML = posts
          .map((post) => {
            const title = stripHtml(post?.title?.rendered) || "Untitled";
            const link = post?.link || "#";
            const excerpt = stripHtml(post?.excerpt?.rendered);
            const image =
              post?._embedded?.["wp:featuredmedia"]?.[0]?.source_url || "";

            return `
              <div class="item">
                ${
                  image
                    ? `<img class="thumb" src="${image}" alt="Insight thumbnail" loading="lazy" />`
                    : ""
                }

                <div class="content">
                  <a class="title" href="${link}" target="_blank" rel="noopener noreferrer">
                    ${title}
                  </a>

                  ${
                    excerpt
                      ? `<div class="excerpt">${excerpt}</div>`
                      : ""
                  }
                </div>
              </div>
            `;
          })
          .join("");
      } catch (error) {
        feedEl.innerHTML =
          '<div class="error">Unable to load insights right now.</div>';

        console.error("Feed load error:", error);
      }
    }

    loadFeed();
  </script>
</body>
</html>

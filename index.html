<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insights Feed</title>

  <style>
    :root {
      --text: #2f2f2f;
      --muted: #555555;
      --border: #e5e5e5;
      --link: #254e2b;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      line-height: 1.45;
    }

    .feed {
      display: flex;
      flex-direction: column;
    }

    .item {
      display: flex;
      gap: 14px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .item:last-child {
      border-bottom: none;
    }

    .thumb {
      width: 84px;
      height: 84px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
      background: #f5f5f5;
    }

    .content {
      flex: 1;
      min-width: 0;
    }

    .title {
      display: inline-block;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 700;
      color: var(--link);
      text-decoration: none;
      margin-bottom: 5px;
    }

    .title:hover {
      text-decoration: underline;
    }

    .excerpt {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .status,
    .error {
      font-size: 14px;
      color: var(--muted);
      padding: 8px 0;
    }

    .error {
      color: #a1260d;
    }
  </style>
</head>

<body>
  <div id="feed" class="feed">
    <div class="status">Loading insights...</div>
  </div>

  <script>
    const apiUrl =
      "https://sbbotanicgarden.org/wp-json/wp/v2/insight?per_page=5&_embed";

    const feedEl = document.getElementById("feed");

    function stripHtml(html) {
      const div = document.createElement("div");
      div.innerHTML = html || "";
      return div.textContent || div.innerText || "";
    }

    async function loadFeed() {
      try {
        const response = await fetch(apiUrl, { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const posts = await response.json();

        if (!Array.isArray(posts) || posts.length === 0) {
          feedEl.innerHTML = '<div class="status">No insights found.</div>';
          return;
        }

        feedEl.innerHTML = posts
          .map((post) => {
            const title = stripHtml(post?.title?.rendered) || "Untitled";
            const link = post?.link || "#";
            const excerpt = stripHtml(post?.excerpt?.rendered);
            const image =
              post?._embedded?.["wp:featuredmedia"]?.[0]?.source_url || "";

            return `
              <div class="item">
                ${image ? `<img class="thumb" src="${image}" alt="Insight thumbnail" loading="lazy" />` : ""}
                <div class="content">
                  <a class="title" href="${link}" target="_blank" rel="noopener noreferrer">
                    ${title}
                  </a>
                  ${excerpt ? `<div class="excerpt">${excerpt}</div>` : ""}
                </div>
              </div>
            `;
          })
          .join("");
      } catch (error) {
        feedEl.innerHTML =
          '<div class="error">Unable to load insights right now.</div>';
        console.error("Feed load error:", error);
      }
    }

    loadFeed();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Garden News Feed</title>

  <style>
    @font-face {
      font-family: "ABCFavorit";
      src: url("./fonts/ABCFavorit-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
    }
    
    @font-face {
      font-family: "ABCFavorit";
      src: url("./fonts/ABCFavorit-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
    }

    :root {
      --text: #3B3B3D;
      --border: #e5e5e5;
      --bg: #ffffff;
      --badge-bg: #f3f4f2;
      --button-bg: #254e2b;
      --button-hover: #1f3f22;
      --button-text: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body,
    input,
    select,
    button,
    .title,
    .excerpt,
    .meta,
    .badge,
    .page-count,
    .status,
    .error,
    .date,
    .author {
      font-family: "ABCFavorit", Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 12px 16px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 150px 190px 160px;
      gap: 8px;
      margin-bottom: 12px;
    }

    input,
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
      background: #ffffff;
      color: var(--text);
    }

    .filter-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background: var(--button-bg);
      color: var(--button-text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: var(--button-hover);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .feed {
      display: flex;
      flex-direction: column;
      color: var(--text);
    }

    .item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .item:last-child {
      border-bottom: none;
    }

    .thumb {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
      background: #f5f5f5;
    }

    .content {
      flex: 1;
      min-width: 0;
      color: var(--text);
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
      color: var(--text);
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text);
      background: var(--badge-bg);
      padding: 3px 6px;
      border-radius: 999px;
    }

    .date,
    .author {
      font-size: 12px;
      color: var(--text);
    }

    .title,
    .title:link,
    .title:visited,
    .title:hover,
    .title:active,
    .title:focus {
      display: inline-block;
      font-size: 15px;
      font-weight: 700;
      color: #3B3B3D !important;
      -webkit-text-fill-color: #3B3B3D !important;
      text-decoration: none;
    }

    .title:hover {
      text-decoration: underline;
    }

    .excerpt {
      margin-top: 4px;
      font-size: 13px;
      color: var(--text);
    }

    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      padding-top: 10px;
    }

    .page-count,
    .status {
      font-size: 14px;
      color: var(--text);
    }

    .error {
      font-size: 14px;
      color: #a1260d;
    }

    @media (max-width: 760px) {
      .filters {
        grid-template-columns: 1fr;
      }

      .thumb {
        width: 72px;
        height: 72px;
      }
    }
  </style>
</head>

<body>
  <div class="filters">
    <input id="searchInput" type="search" placeholder="Search by keyword, date, author, department, or type..." />

    <select id="dateFilter">
      <option value="all">All dates</option>
      <option value="7">Last 7 days</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
      <option value="365">Last year</option>
    </select>

    <select id="departmentFilter">
      <option value="all">All departments</option>
    </select>

    <select id="typeFilter">
      <option value="all">All types</option>
      <option value="Staff News">Staff News</option>
      <option value="Press Release">Press Release</option>
      <option value="Insight">Insight</option>
    </select>
  </div>

  <div class="filter-actions">
    <button id="searchButton">Search</button>
    <button id="clearButton">Clear</button>
  </div>

  <div id="feed" class="feed">
    <div class="status">Loading updates...</div>
  </div>

  <div class="pager">
    <button id="prevButton">Prev</button>
    <div id="pageCount" class="page-count"></div>
    <button id="nextButton">Next</button>
  </div>

  <script>
    const insightUrl = "https://sbbotanicgarden.org/wp-json/wp/v2/insight?per_page=20&_embed";
    const staffNewsUrl = "https://mlarasbbg.github.io/insights-feed/sharepoint-news.json";

    const feedEl = document.getElementById("feed");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const clearButton = document.getElementById("clearButton");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const pageCountEl = document.getElementById("pageCount");
    const dateFilter = document.getElementById("dateFilter");
    const departmentFilter = document.getElementById("departmentFilter");
    const typeFilter = document.getElementById("typeFilter");

    let allPosts = [];
    let filteredPosts = [];
    let currentPage = 1;
    const postsPerPage = 10;
    let currentQuery = "";

    function stripHtml(html) {
      const div = document.createElement("div");
      div.innerHTML = html || "";
      return div.textContent || div.innerText || "";
    }

    function normalizeSearchText(value) {
      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^\w\s@.-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function getWpImage(post) {
      return post?._embedded?.["wp:featuredmedia"]?.[0]?.source_url || "";
    }

    function normalizeWordPressPost(post, typeLabel) {
      const title = stripHtml(post?.title?.rendered) || "Untitled";
      const excerpt = stripHtml(post?.excerpt?.rendered);
      const date = post?.date || "";

      return {
        title,
        link: post?.link || "#",
        date,
        readableDate: date ? new Date(date).toLocaleDateString() : "",
        image: getWpImage(post),
        excerpt,
        author: "",
        department: "",
        type: typeLabel,
        contentType: "",
        searchableText: normalizeSearchText(`${title} ${excerpt} ${date} ${typeLabel}`)
      };
    }

    function normalizeStaffPost(post) {
      const title = post?.title || "Untitled";
      const excerpt = post?.excerpt || "";
      const date = post?.date || "";
      const department = post?.department || "";

      const author =
        typeof post?.author === "object"
          ? post?.author?.Title || post?.author?.title || post?.author?.name || post?.author?.email || ""
          : post?.author || "";

      const contentType = post?.contentType || "";

      const type =
        contentType.toLowerCase() === "repost page"
          ? "Press Release"
          : "Staff News";

      return {
        title,
        link: post?.link || "#",
        date,
        readableDate: date ? new Date(date).toLocaleDateString() : "",
        image: post?.image || "",
        excerpt,
        author,
        department,
        type,
        contentType,
        searchableText: normalizeSearchText(`${title} ${excerpt} ${date} ${department} ${author} ${type} ${contentType}`)
      };
    }

    function populateDepartmentFilter() {
      departmentFilter.innerHTML = '<option value="all">All departments</option>';

      const departments = [...new Set(
        allPosts
          .map((post) => post.department)
          .filter((department) => department && department.trim() !== "")
      )].sort();

      departments.forEach((department) => {
        const option = document.createElement("option");
        option.value = department;
        option.textContent = department;
        departmentFilter.appendChild(option);
      });
    }

    async function loadFeed() {
      try {
        const results = await Promise.allSettled([
          fetch(insightUrl, { cache: "no-store" }),
          fetch(staffNewsUrl, { cache: "no-store" })
        ]);

        const [insightResult, staffResult] = results;

        const insights =
          insightResult.status === "fulfilled" && insightResult.value.ok
            ? await insightResult.value.json()
            : [];

        const staffNews =
          staffResult.status === "fulfilled" && staffResult.value.ok
            ? await staffResult.value.json()
            : [];

        allPosts = [
          ...(Array.isArray(insights)
            ? insights.map((post) => normalizeWordPressPost(post, "Insight"))
            : []),
          ...(Array.isArray(staffNews)
            ? staffNews.map((post) => normalizeStaffPost(post))
            : [])
        ].sort((a, b) => new Date(b.date) - new Date(a.date));

        if (allPosts.length === 0) {
          feedEl.innerHTML = '<div class="error">No updates could be loaded from any source.</div>';
          return;
        }

        filteredPosts = allPosts;
        populateDepartmentFilter();
        renderPage();

      } catch (error) {
        feedEl.innerHTML = `<div class="error">Unable to load updates right now: ${error.message}</div>`;
        console.error("Feed load error:", error);
      }
    }

    function applyFilters() {
      currentQuery = normalizeSearchText(searchInput.value);

      const queryTerms = currentQuery.split(" ").filter(Boolean);
      const selectedDate = dateFilter.value;
      const selectedDepartment = departmentFilter.value;
      const selectedType = typeFilter.value;
      const now = new Date();

      filteredPosts = allPosts.filter((post) => {
        const matchesSearch =
          queryTerms.length === 0 ||
          queryTerms.every((term) => post.searchableText.includes(term));

        const matchesDepartment =
          selectedDepartment === "all" || post.department === selectedDepartment;

        const matchesType =
          selectedType === "all" || post.type === selectedType;

        let matchesDate = true;

        if (selectedDate !== "all") {
          const days = Number(selectedDate);
          const postDate = new Date(post.date);
          const cutoff = new Date();
          cutoff.setDate(now.getDate() - days);
          matchesDate = postDate >= cutoff;
        }

        return matchesSearch && matchesDepartment && matchesType && matchesDate;
      });

      currentPage = 1;
      renderPage();
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderPage() {
      const totalPages = Math.max(1, Math.ceil(filteredPosts.length / postsPerPage));
      currentPage = Math.min(currentPage, totalPages);

      if (filteredPosts.length === 0) {
        const message = currentQuery
          ? `No search results for "${escapeHtml(currentQuery)}" found.`
          : "No results found for the selected filters.";

        feedEl.innerHTML = `<div class="status">${message}</div>`;
        pageCountEl.textContent = "";
        prevButton.disabled = true;
        nextButton.disabled = true;
        return;
      }

      const start = (currentPage - 1) * postsPerPage;
      const visiblePosts = filteredPosts.slice(start, start + postsPerPage);

      feedEl.innerHTML = visiblePosts
        .map((post) => {
          const primaryBadge =
            post.type === "Staff News"
              ? post.department || "Staff News"
              : post.type;

          return `
            <div class="item">
              ${post.image ? `<img class="thumb" src="${escapeHtml(post.image)}" alt="${escapeHtml(primaryBadge)} thumbnail" loading="lazy" />` : ""}

              <div class="content">
                <div class="meta">
                  <span class="badge">${escapeHtml(primaryBadge)}</span>
                  <span class="date">${escapeHtml(post.readableDate)}</span>
                  ${post.author ? `<span class="author">By ${escapeHtml(post.author)}</span>` : ""}
                </div>

                <a class="title" href="${escapeHtml(post.link)}" target="_blank" rel="noopener noreferrer">
                  ${escapeHtml(post.title)}
                </a>

                ${post.excerpt ? `<div class="excerpt">${escapeHtml(post.excerpt)}</div>` : ""}
              </div>
            </div>
          `;
        })
        .join("");

      pageCountEl.textContent = `Page ${currentPage} of ${totalPages}`;
      prevButton.disabled = currentPage === 1;
      nextButton.disabled = currentPage === totalPages;
    }

    searchButton.addEventListener("click", applyFilters);

    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        applyFilters();
      }
    });

    clearButton.addEventListener("click", () => {
      searchInput.value = "";
      dateFilter.value = "all";
      departmentFilter.value = "all";
      typeFilter.value = "all";
      currentQuery = "";
      filteredPosts = allPosts;
      currentPage = 1;
      renderPage();
    });

    dateFilter.addEventListener("change", applyFilters);
    departmentFilter.addEventListener("change", applyFilters);
    typeFilter.addEventListener("change", applyFilters);

    prevButton.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        renderPage();
      }
    });

    nextButton.addEventListener("click", () => {
      const totalPages = Math.ceil(filteredPosts.length / postsPerPage);

      if (currentPage < totalPages) {
        currentPage++;
        renderPage();
      }
    });

    loadFeed();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Garden News Feed</title>

  <!-- FAVORIT FONT -->
  <link rel="preload"
        href="https://mlarasbbg.github.io/Fonts/ABCFavorit-Regular.woff2"
        as="font"
        type="font/woff2"
        crossorigin>

  <style>

    @font-face {
      font-family: "ABCFavorit";
      src: url("https://mlarasbbg.github.io/Fonts/ABCFavorit-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: "ABCFavorit";
      src: url("https://mlarasbbg.github.io/Fonts/ABCFavorit-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
    }

    :root {
      --text: #3B3B3D;
      --muted: #6b6b6b;
      --border: #e5e5e5;
      --link: #254e2b;
      --bg: #ffffff;
      --badge-bg: #f3f4f2;
      --button-bg: #254e2b;
      --button-hover: #1f3f22;
      --button-text: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body,
    input,
    select,
    button,
    .title,
    .excerpt,
    .meta,
    .badge,
    .page-count,
    .status,
    .error {
      font-family: "ABCFavorit", Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 12px 16px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 150px 190px 160px;
      gap: 8px;
      margin-bottom: 12px;
    }

    input,
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
      background: #ffffff;
      color: var(--text);
    }

    .filter-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background: var(--button-bg);
      color: var(--button-text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: var(--button-hover);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .feed {
      display: flex;
      flex-direction: column;
    }

    .item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .item:last-child {
      border-bottom: none;
    }

    .thumb {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
      background: #f5f5f5;
    }

    .content {
      flex: 1;
      min-width: 0;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--badge-bg);
      padding: 3px 6px;
      border-radius: 999px;
    }

    .date,
    .author {
      font-size: 12px;
      color: var(--muted);
    }

    .title {
      display: inline-block;
      font-size: 15px;
      font-weight: 700;
      color: var(--link);
      text-decoration: none;
    }

    .title:hover {
      text-decoration: underline;
    }

    .excerpt {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
    }

    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      padding-top: 10px;
    }

    .page-count,
    .status,
    .error {
      font-size: 14px;
      color: var(--muted);
    }

    .error {
      color: #a1260d;
    }

    @media (max-width: 760px) {
      .filters {
        grid-template-columns: 1fr;
      }

      .thumb {
        width: 72px;
        height: 72px;
      }
    }

  </style>
</head>
